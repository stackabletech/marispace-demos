---
apiVersion: authentication.stackable.tech/v1alpha1
kind: AuthenticationClass
metadata:
  name: uc2-superset
spec:
  provider:
    oidc:
      hostname: kc.ssi.stackable.tech
      rootPath: /realms/test
      principalClaim: preferred_username
      scopes:
      - openid
      - profile
      tls:
        verification:
          server:
            caCert:
              webPki: {}
---
apiVersion: superset.stackable.tech/v1alpha1
kind: SupersetCluster
metadata:
  name: superset
spec:
  image:
    productVersion: 4.0.2
  clusterConfig:
    listenerClass: external-unstable
    authentication:
      - authenticationClass: uc2-superset
        oidc:
          clientCredentialsSecret: kc-superset-oidc-config
    authorization:
      roleMappingFromOpa:
        configMapName: opa
        package: superset
        cache: {}
    credentialsSecret: superset-credentials
    mapboxSecret: superset-mapbox-api-key
  nodes:
    roleGroups:
      default:
        replicas: 1
    configOverrides:
      superset_config.py:
        # MAPBOX
        ROW_LIMIT: "200000"
        SQL_MAX_ROW: "200000"
        # OIDC
        AUTH_TYPE: "AUTH_OID"
        OIDC_CLIENT_SECRETS: '"oidc/client_config.json"'
        OIDC_ID_TOKEN_COOKIE_SECURE: '"false"'
        OIDC_OPENID_REALM: '"test"'
        OIDC_INTROSPECTION_AUTH_METHOD: '"client_secret_post"'
        EXPERIMENTAL_FILE_FOOTER: |
          from flask_oidc import OpenIDConnect
          from flask_appbuilder.security.views import AuthOIDView
          from flask_appbuilder.views import expose
          from flask_appbuilder.security.manager import AUTH_OID
          from flask_login import login_user
          from flask import redirect, request, session
          from urllib.parse import quote
          import logging


          class MarispaceXSecurityManager(OpaSupersetSecurityManager):
              def __init__(self, appbuilder):
                  super(MarispaceXSecurityManager, self).__init__(appbuilder)
                  self.oid = OpenIDConnect(self.appbuilder.get_app)
                  self.authoidview = AuthOIDCView


          class AuthOIDCView(AuthOIDView):
              @expose("/login/", methods=["GET", "POST"])
              def login(self, flag=True):
                  sm = self.appbuilder.sm
                  oidc = sm.oid

                  @self.appbuilder.sm.oid.require_login
                  def handle_login():
                      user = sm.auth_user_oid(f"{oidc.user_getfield('preferred_username')}@marispacex.com")

                      # None will be returned if it is the users first time login into superset using keycloak.
                      if user is None:
                          info = oidc.user_getinfo(["preferred_username"])
                          user = sm.add_user(
                              info.get("preferred_username"),
                              "Marispace-X",
                              "Participant",
                              f"{info.get('preferred_username')}@marispacex.com",
                              [sm.find_role("Public")],
                          )
                      sm.get_user_roles(user)
                      sm.update_user(user)

                      login_user(user, remember=False)
                      logging.debug(f"Logged in {user}")
                      return redirect(self.appbuilder.get_url_for_index)

                  return handle_login()

              @expose("/logout/", methods=["GET", "POST"])
              def logout(self):
                  oidc = self.appbuilder.sm.oid

                  oidc.logout()
                  super(AuthOIDCView, self).logout()
                  redirect_url = request.url_root + "logout"

                  return redirect(
                      # This works with Keycloak > 18 as there was a breaking change in `redirect_uri`
                      oidc.client_secrets.get("issuer")
                      + "/protocol/openid-connect/logout?post_logout_redirect_uri="
                      + quote(redirect_url)
                      + "&id_token_hint="
                      + session.get("oidc_auth_token").get("id_token")
                  )
          CUSTOM_SECURITY_MANAGER = MarispaceXSecurityManager
          FEATURE_FLAGS = {
              'DASHBOARD_RBAC': True,
          }
    podOverrides:
      spec:
        containers:
          - name: superset
            volumeMounts:
              - mountPath: /stackable/oidc
                name: kc-superset-oidc-config
        volumes:
          - name: kc-superset-oidc-config
            secret:
              secretName: kc-superset-oidc-config
---
apiVersion: v1
kind: Secret
metadata:
  name: superset-credentials
type: Opaque
stringData:
  adminUser.username: admin
  adminUser.firstname: Superset
  adminUser.lastname: Admin
  adminUser.email: admin@superset.com
  adminUser.password: adminadmin
  connections.secretKey: supersetSecretKey
  connections.sqlalchemyDatabaseUri: postgresql://superset:superset@postgresql-superset/superset
---
